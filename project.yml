# Xcode projesi bu dosyadan üretilir: `xcodegen generate` (bkz. README "Geliştirme").
# .xcodeproj depoya eklenmez; tek doğruluk kaynağı bu dosyadır.
name: Kumbara
options:
  bundleIdPrefix: com.alikvkli
  developmentLanguage: tr
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEVELOPMENT_TEAM: ""                 # TODO(Q10): Apple Developer Team ID — README › "iCloud eşitlemeyi açma"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  KumbaraCore:
    path: Packages/KumbaraCore
  KumbaraData:
    path: Packages/KumbaraData
  KumbaraMarket:
    path: Packages/KumbaraMarket
  KumbaraCapture:
    path: Packages/KumbaraCapture

targets:
  Kumbara:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes:
          - Resources/AppIcon.icon
      # Icon Composer paketi tek dosya olarak eklenir (klasör olarak gezilmez).
      - path: App/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: KumbaraCore
      - package: KumbaraData
      - package: KumbaraMarket
      - package: KumbaraCapture
      - target: KumbaraShare        # PlugIns/ içine gömülür (REQ-C2)
      - target: KumbaraWidgets      # widget'lar ve Denetim Merkezi kontrolleri (specs/09 §4)
    # Arka plan fiyat yenilemesi (REQ-M2, BGAppRefreshTask). Diğer anahtarlar INFOPLIST_KEY_* ile üretilir.
    info:
      path: Config/Kumbara-Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers: [com.alikvkli.kumbara.refresh]
        UIBackgroundModes: [fetch, remote-notification]   # remote-notification: iCloud eşitleme bildirimleri
        # Widget, Denetim Merkezi ve menü çubuğu bağlantıları (specs/09 §4).
        CFBundleURLTypes:
          - CFBundleURLName: com.alikvkli.kumbara
            CFBundleURLSchemes: [kumbara]
    entitlements:
      path: Config/Kumbara.entitlements
      properties:
        # Paylaş uzantısıyla ortak gelen kutusu (specs/05 §4). İmzalı derleme Team ID ister (Q10).
        com.apple.security.application-groups: [group.com.alikvkli.kumbara]
    scheme:
      testTargets:
        - KumbaraUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alikvkli.kumbara
        PRODUCT_NAME: Kumbara
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kumbara
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Kumbara'nın kilidini Face ID ile açmak için."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Fiş veya banka ekran görüntüsünü okumak için seçtiğin fotoğrafa erişilir. Görüntü cihazından çıkmaz.
        INFOPLIST_KEY_NSCameraUsageDescription: Fişini tarayıp harcamayı otomatik oluşturmak için kamera kullanılır. Görüntü cihazından çıkmaz.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon      # App/Resources/AppIcon.icon (Icon Composer)
        TARGETED_DEVICE_FAMILY: "1,2"
        # macOS sandbox (specs/00 C1: yalnız giden ağ + kullanıcının seçtiği dosyalar)
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SELECTED_FILES: readonly

  # Paylaş menüsü → Kumbara (REQ-C2). OCR yapmaz; dosyayı App Group gelen kutusuna yazar.
  KumbaraShare:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Extensions/Share
      - path: App/Resources/Assets.xcassets   # AccentColor (uzantı da aynı vurgu rengini kullanır)
    dependencies:
      - package: KumbaraCore
    entitlements:
      path: Config/KumbaraShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.alikvkli.kumbara]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alikvkli.kumbara.share
        PRODUCT_NAME: KumbaraShare
        INFOPLIST_FILE: Config/KumbaraShare-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kumbara
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SELECTED_FILES: readonly

  # Widget'lar ve Denetim Merkezi kontrolleri (REQ-X5, X8). Uygulamanın App Group'a yazdığı özeti okur.
  KumbaraWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Extensions/Widgets
      - path: App/Resources/Assets.xcassets
    dependencies:
      - package: KumbaraCore
      - package: KumbaraMarket
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Config/KumbaraWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.alikvkli.kumbara]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alikvkli.kumbara.widgets
        PRODUCT_NAME: KumbaraWidgets
        INFOPLIST_FILE: Config/KumbaraWidgets-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kumbara
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES

  KumbaraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Kumbara
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alikvkli.kumbara.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Kumbara
