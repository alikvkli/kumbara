name: CI

# Dakika bütçesi: macOS çalıştırıcıları Linux'un 10 katı sayılır.
# - Her push: yalnız Linux (Core + Market testleri).
# - macOS (Data testleri, iOS + macOS derleme, UI testleri): commit mesajında [mac] ya da
#   [screenshots] varsa, PR'da veya elle (workflow_dispatch) başlatılınca.
# - Ekran görüntüleri aynı macOS işinde, aynı derlemeyle alınır (ikinci bir derleme yok).
# - Yalnız doküman değişen push'lar CI başlatmaz.
on:
  push:
    paths-ignore:
      - 'specs/**'
      - '**/*.md'
      - 'Design/**'
  pull_request:
  workflow_dispatch:
    inputs:
      screenshots:
        description: 'Ekran görüntüleri de alınsın'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: KumbaraCore (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v5
      - name: Test KumbaraCore
        run: swift test --package-path Packages/KumbaraCore -Xswiftc -warnings-as-errors
      - name: Test KumbaraMarket
        run: swift test --package-path Packages/KumbaraMarket -Xswiftc -warnings-as-errors

  app-apple:
    name: App (iOS + macOS)
    needs: core-linux
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[mac]') ||
      contains(github.event.head_commit.message, '[screenshots]')
    runs-on: macos-26
    env:
      SCREENSHOTS: ${{ contains(github.event.head_commit.message, '[screenshots]') || inputs.screenshots == true }}
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Test KumbaraData (macOS, SwiftData)
        run: swift test --package-path Packages/KumbaraData
      - name: Build macOS
        run: >
          set -o pipefail &&
          xcodebuild build -project Kumbara.xcodeproj -scheme Kumbara
          -destination 'generic/platform=macOS' -derivedDataPath build-mac
          CODE_SIGNING_ALLOWED=NO | xcbeautify
      - name: Verify app icon is compiled
        run: |
          APP=$(find build-mac/Build/Products -maxdepth 2 -name 'Kumbara.app' | head -1)
          plutil -p "$APP/Contents/Info.plist" | grep -E 'CFBundleIconName|CFBundleIdentifier'
          plutil -p "$APP/Contents/Info.plist" | grep -q 'CFBundleIconName'
      - name: Build iOS for testing
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [(runtime, d) for runtime, items in devices.items() if ".iOS-" in runtime
                    for d in items if d["name"].startswith("iPhone") and "Pro" in d["name"] and "Max" not in d["name"]]
          version = lambda r: [int(x) for x in r.split(".iOS-")[1].split("-")]
          phones.sort(key=lambda p: (version(p[0]), p[1]["name"]))
          print(phones[-1][1]["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcodebuild build-for-testing -project Kumbara.xcodeproj -scheme Kumbara \
            -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO | xcbeautify
      - name: UI test (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Kumbara.xcodeproj -scheme Kumbara \
            -destination "id=$UDID" -derivedDataPath build -resultBundlePath ui-tests.xcresult | xcbeautify
      - name: Crash logs and test results on failure
        if: failure()
        run: |
          mkdir -p failure
          cp -R ui-tests.xcresult failure/ 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/Kumbara*.ips failure/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-failure
          path: failure
          if-no-files-found: ignore

      # Ekran görüntüleri: aynı derleme, açık + koyu; macOS penceresi.
      - name: iOS screenshots
        if: env.SCREENSHOTS == 'true'
        run: |
          set -o pipefail
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          mkdir -p "$PWD/screenshots"
          for APPEARANCE in light dark; do
            xcrun simctl ui "$UDID" appearance "$APPEARANCE"
            TEST_RUNNER_SCREENSHOT_DIR="$PWD/screenshots" TEST_RUNNER_SCREENSHOT_SUFFIX="$APPEARANCE" \
            xcodebuild test-without-building -project Kumbara.xcodeproj -scheme Kumbara \
              -destination "id=$UDID" -derivedDataPath build \
              -only-testing:KumbaraUITests/ScreenshotTests \
              -only-testing:KumbaraUITests/CaptureUITests/testDemoReceiptIsRecognised | xcbeautify
          done
          ls -la screenshots
      - name: macOS screenshot
        if: env.SCREENSHOTS == 'true'
        continue-on-error: true
        run: |
          APP=$(find build-mac/Build/Products -maxdepth 2 -name 'Kumbara.app' | head -1)
          codesign --force --deep -s - "$APP"
          open -n "$APP" --args -ui-testing -demo-data -AppleLanguages '(tr)' -AppleLocale tr_TR
          sleep 10
          osascript -e 'tell application "System Events" to tell process "Kumbara" to set frontmost to true' || true
          sleep 2
          screencapture -x screenshots/macos-1-ozet-light.png
      # Bir ekran görüntüsü testi düşse de alınanlar yüklenir.
      - uses: actions/upload-artifact@v4
        if: always() && env.SCREENSHOTS == 'true'
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn

  # Commit mesajında [corpus] varsa: üretilmiş fişler + Commons'taki gerçek fişler, gerçek Vision OCR'ından
  # geçirilip test fixture'ı olarak artifact'a konur (specs/04 §6, T3.1).
  corpus-images:
    name: Corpus images
    if: contains(github.event.head_commit.message, '[corpus]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Generate synthetic receipts
        run: |
          sudo apt-get install -y fonts-dejavu-core fonts-liberation >/dev/null
          pip install --quiet pillow
          python3 Tools/corpus/generate.py corpus-in
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-images
          path: corpus-in/

  corpus-ocr:
    name: Corpus OCR (Vision)
    needs: corpus-images
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - uses: actions/download-artifact@v4
        with:
          name: corpus-images
          path: corpus-in
      - name: Fetch Commons receipts
        continue-on-error: true
        run: python3 Tools/corpus/fetch_commons.py corpus-in
      - name: OCR with Vision
        run: swift run --package-path Packages/KumbaraCapture -c release kumbara-ocr corpus-in corpus-out
      - name: Keep images next to OCR output for review
        run: cp corpus-in/*.jpg corpus-out/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-ocr
          path: corpus-out/
